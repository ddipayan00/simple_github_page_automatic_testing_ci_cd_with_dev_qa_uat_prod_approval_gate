<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Links to every environment of the CI/CD demo site.">
  <title>Environments · CI/CD demo commit 1</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #59636e; --line: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9198a1; --line: #30363d; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(480px, calc(100% - 32px)); margin: 3rem auto; }
    h1 { font-size: 1.5rem; }
    ul { list-style: none; padding: 0; display: grid; gap: 0.5rem; }
    a { display: flex; justify-content: space-between; padding: 0.75rem 1rem; background: var(--card);
        border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px;
        color: inherit; text-decoration: none; font-weight: 600; }
    a:hover { border-color: var(--c); }
    small { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>Environments</h1>
    <ul>
      <li><a href="dev/" style="--c:#0969da">DEV <small>auto-deploy</small></a></li>
      <li><a href="qa/" style="--c:#8250df">QA <small>approval</small></a></li>
      <li><a href="uat/" style="--c:#bc4c00">UAT <small>approval</small></a></li>
      <li><a href="prod/" style="--c:#1a7f37">PROD <small>approval</small></a></li>
    </ul>
  </main>
</body>
</html>
